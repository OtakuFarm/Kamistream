<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>KamiStream — Watch Anime Free in HD</title>
    <meta name="description" content="Stream thousands of anime episodes free on KamiStream. Sub & dub, trending, seasonal and classic anime all in one place. No account needed." />
    <meta name="keywords" content="watch anime free, anime streaming, sub dub anime, KamiStream, anime online HD" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#ff006e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KamiStream" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.kamistream.fun" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KamiStream" />
    <meta property="og:title" content="KamiStream — Watch Anime Free in HD" />
    <meta property="og:description" content="Stream thousands of anime episodes free. Sub & dub, trending, seasonal and classic anime. No account needed." />
    <meta property="og:image" content="https://www.kamistream.fun/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://www.kamistream.fun" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KamiStream — Watch Anime Free in HD" />
    <meta name="twitter:description" content="Stream thousands of anime episodes free. Sub & dub, trending, seasonal and classic anime." />
    <meta name="twitter:image" content="https://www.kamistream.fun/opengraph.jpg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Icons. favicon.svg is the vector source; the PNG/ICO rasters are the
         same design, generated at build time by scripts/generate-icons.mjs.
         Clients that cannot use SVG need the rasters — before they existed
         these URLs fell through the SPA rewrite and returned HTML, so the
         PWA had no usable icon and iOS showed a blank grey tile. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="mask-icon" href="/favicon.svg?v=2" color="#ff2d78" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />

    <!-- Ad CDN preconnect — faster tag loads = better viewability & fill -->
    <link rel="preconnect" href="https://quge5.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://al5sm.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://nap5k.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://n6wxm.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://www.highperformanceformat.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://pl30707076.effectivecpmnetwork.com" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="https://pl30707075.effectivecpmnetwork.com" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Sitemap hint — submit sitemap-index.xml in Search Console; it points
         at the two child sitemaps (static pages/categories/genres/years, and
         anime/media pages with poster images). -->
    <link rel="sitemap" type="application/xml" href="/sitemap-index.xml" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- API preconnects — data that paints the page content -->
    <link rel="preconnect" href="https://api.jikan.moe" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="https://graphql.anilist.co" />

    <!-- JSON-LD: Site identity -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "KamiStream",
      "url": "https://www.kamistream.fun",
      "description": "Free anime streaming — sub & dub, HD quality",
      "publisher": { "@id": "https://www.kamistream.fun/#organization" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.kamistream.fun/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://www.kamistream.fun/#organization",
      "name": "KamiStream",
      "url": "https://www.kamistream.fun",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.kamistream.fun/icons/icon-512.png",
        "width": 512,
        "height": 512,
        "caption": "KamiStream"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ImageObject",
      "url": "https://www.kamistream.fun/opengraph.jpg",
      "contentUrl": "https://www.kamistream.fun/opengraph.jpg",
      "width": 1200,
      "height": 630
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/ads.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
